<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TOEIC Listening & Quiz App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        function App() {
            // ステート管理
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isAiModalOpen, setIsAiModalOpen] = useState(false);
            
            // クイズデータ
            const [questions, setQuestions] = useState([
                {
                    id: 1,
                    question: "Where is the annual marketing conference being held this year?",
                    options: [
                        "A) In the main auditorium on the third floor.",
                        "B) Yes, the budget has already been approved.",
                        "C) Next Tuesday at around 2 PM."
                    ],
                    answer: 0,
                    explanation: "場所を尋ねる疑問詞 'Where' に対する適切な答えは、選択肢Aの場所を示す表現です。"
                },
                {
                    id: 2,
                    question: "When will the quarterly financial report be finalized?",
                    options: [
                        "A) Financial statements and receipts.",
                        "B) By the end of this week, hopefully.",
                        "C) Mr. Davis from accounting."
                    ],
                    answer: 1,
                    explanation: "時期を尋ねる 'When' に対する答えとして、期限を示す 'By the end of this week' が適切です。"
                }
            ]);

            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isAnswerRevealed, setIsAnswerRevealed] = useState(false);
            
            // ★追加：テキストを隠す（ぼかす）状態の管理（初期値はtrue＝隠す）
            const [isTextBlurred, setIsTextBlurred] = useState(true);

            // AI生成用モーダルのフォーム
            const [aiTheme, setAiTheme] = useState('TOEIC Part 2 (Response)');
            const [aiCount, setAiCount] = useState(3);
            const [isGenerating, setIsGenerating] = useState(false);

            // APIキー保存
            const saveApiKey = (key) => {
                setApiKey(key);
                localStorage.setItem('gemini_api_key', key);
                setIsSettingsOpen(false);
            };

            // 音声読み上げ（Web Speech API）
            const speakText = (text, onEndCallback) => {
                if (!('speechSynthesis' in window)) {
                    alert('お使いのブラウザは音声読み上げに対応していません。');
                    if (onEndCallback) onEndCallback();
                    return;
                }
                window.speechSynthesis.cancel(); // 既存の音声を停止
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US'; // 英語リスニング用
                utterance.rate = 0.9; // 少し聞き取りやすい速度

                if (onEndCallback) {
                    utterance.onend = onEndCallback;
                }
                window.speechSynthesis.speak(utterance);
            };

            // 問題・選択肢の連続音声再生（キューイング）
            const playListeningSequence = () => {
                const currentQ = questions[currentIndex];
                // 1. まず質問文を読み上げる
                speakText(currentQ.question, () => {
                    // 2. 質問が終わったら少し間を空けて、選択肢を順番に読み上げる
                    setTimeout(() => {
                        readOptionsSequentially(currentQ.options, 0);
                    }, 500);
                });
            };

            const readOptionsSequentially = (options, index) => {
                if (index >= options.length) return;
                speakText(options[index], () => {
                    setTimeout(() => {
                        readOptionsSequentially(options, index + 1);
                    }, 400);
                });
            };

            // 次の問題へ進む
            const handleNext = () => {
                if (currentIndex < questions.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                    setSelectedOption(null);
                    setIsAnswerRevealed(false);
                    // ★次の問題に移動した瞬間に、自動でテキストを隠す（ぼかす）状態に戻す！
                    setIsTextBlurred(true);
                    window.speechSynthesis.cancel();
                }
            };

            // 前の問題へ戻る
            const handlePrev = () => {
                if (currentIndex > 0) {
                    setCurrentIndex(currentIndex - 1);
                    setSelectedOption(null);
                    setIsAnswerRevealed(false);
                    // ★前の問題に戻ったときも同様にテキストを隠す
                    setIsTextBlurred(true);
                    window.speechSynthesis.cancel();
                }
            };

            // AI問題生成機能 (Gemini API呼び出し)
            const generateQuestionsByAI = async () => {
                if (!apiKey) {
                    alert('先にAPIキーを設定してください。');
                    setIsSettingsOpen(true);
                    return;
                }

                setIsGenerating(true);
                const prompt = `あなたはプロのTOEIC講師です。以下のテーマでTOEIC形式の問題を ${aiCount} 問作成してください。
テーマ: ${aiTheme}
出力は必ず以下のJSON配列フォーマットのみで行ってください（Markdownのバッククォートなども含めず、純粋なJSON配列文字列にしてください）。余計な解説は不要です。

[
  {
    "question": "英文の質問",
    "options": ["A) 選択肢1", "B) 選択肢2", "C) 選択肢3"],
    "answer": 0,
    "explanation": "日本語の解説"
  }
]
`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    const data = await response.json();
                    const textResponse = data.candidates[0].content.parts[0].text;
                    
                    // JSONの抽出（パース処理の安全化）
                    let cleanJsonText = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                    const newQs = JSON.parse(cleanJsonText);

                    // データの形式を整えてセット
                    const formattedQs = newQs.map((q, idx) => ({
                        id: Date.now() + idx,
                        question: q.question,
                        options: q.options,
                        answer: q.answer,
                        explanation: q.explanation
                    }));

                    setQuestions(formattedQs);
                    setCurrentIndex(0);
                    setSelectedOption(null);
                    setIsAnswerRevealed(false);
                    setIsTextBlurred(true); // 生成された新問題ももちろんぼかし状態からスタート
                    setIsAiModalOpen(false);
                } catch (error) {
                    console.error(error);
                    alert('AI問題の生成に失敗しました。APIキーを確認してください。');
                } finally {
                    setIsGenerating(false);
                }
            };

            const currentQ = questions[currentIndex];

            return (
                <div className="min-h-screen flex flex-col">
                    {/* ヘッダー */}
                    <header className="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center space-x-3">
                            <span className="bg-indigo-600 text-white p-2 rounded-lg font-bold">🎧</span>
                            <h1 className="text-xl font-bold text-slate-800">TOEIC Listening Trainer</h1>
                        </div>
                        <div className="flex items-center space-x-3">
                            <button 
                                onClick={() => setIsAiModalOpen(true)}
                                className="bg-gradient-to-r from-indigo-500 to-violet-600 text-white px-4 py-2 rounded-lg font-medium text-sm shadow hover:opacity-90 transition flex items-center space-x-1"
                            >
                                <span>✨ AI問題生成</span>
                            </button>
                            <button 
                                onClick={() => setIsSettingsOpen(true)}
                                className="p-2 text-slate-600 hover:bg-slate-100 rounded-lg transition"
                                title="設定"
                            >
                                ⚙️
                            </button>
                        </div>
                    </header>

                    {/* メインコンテンツ */}
                    <main className="flex-1 max-w-3xl w-full mx-auto p-6 flex flex-col justify-center">
                        <div className="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden p-8">
                            
                            {/* 進捗とコントロールバー */}
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                <span className="text-sm font-semibold text-indigo-600 bg-indigo-50 px-3 py-1 rounded-full">
                                    Question {currentIndex + 1} / {questions.length}
                                </span>
                                <div className="flex items-center space-x-2">
                                    {/* テキスト表示・非表示（ぼかし）切り替えボタン */}
                                    <button 
                                        onClick={() => setIsTextBlurred(!isTextBlurred)}
                                        className={`text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center space-x-1 ${
                                            isTextBlurred ? 'bg-amber-100 text-amber-800 hover:bg-amber-200' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'
                                        }`}
                                    >
                                        <span>{isTextBlurred ? '👁️ テキストを表示する' : '🔒 テキストを隠す'}</span>
                                    </button>
                                </div>
                            </div>

                            {/* 音声再生ボタン（メイン） */}
                            <div className="text-center my-8">
                                <button 
                                    onClick={playListeningSequence}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-8 py-4 rounded-full shadow-lg hover:shadow-xl transition transform active:scale-95 flex items-center justify-center space-x-3 mx-auto text-lg"
                                >
                                    <span>🔊 リスニング音声を再生 (自動連続)</span>
                                </button>
                                <p className="text-xs text-slate-400 mt-2">質問文から選択肢まで続けて流れます</p>
                            </div>

                            {/* 問題文・選択肢セクション（ぼかし制御） */}
                            <div className={`space-y-6 transition-all duration-300 ${isTextBlurred ? 'filter blur-md select-none cursor-pointer' : ''}`}
                                 onClick={() => { if(isTextBlurred) setIsTextBlurred(false); }}
                                 title={isTextBlurred ? "クリックすると一時的にテキストが表示されます" : ""}
                            >
                                {isTextBlurred && (
                                    <div className="text-center text-xs text-amber-600 font-bold bg-amber-50 py-1 rounded">
                                        🔒 テキストは隠されています（クリックまたは上のボタンで解除可能。次の問題に進むと自動でまた隠れます）
                                    </div>
                                )}

                                <div>
                                    <h2 className="text-lg font-bold text-slate-900 mb-4">
                                        {currentQ.question}
                                    </h2>
                                </div>

                                <div className="space-y-3">
                                    {currentQ.options.map((option, idx) => {
                                        let btnStyle = "w-full text-left p-4 rounded-xl border transition font-medium ";
                                        if (selectedOption !== null) {
                                            if (idx === currentQ.answer) {
                                                btnStyle += "bg-emerald-50 border-emerald-300 text-emerald-800";
                                            } else if (idx === selectedOption) {
                                                btnStyle += "bg-rose-50 border-rose-300 text-rose-800";
                                            } else {
                                                btnStyle += "bg-white border-slate-200 text-slate-600 opacity-60";
                                            }
                                        } else {
                                            btnStyle += "bg-white border-slate-200 hover:border-indigo-300 hover:bg-slate-50 text-slate-700";
                                        }

                                        return (
                                            <button 
                                                key={idx}
                                                onClick={() => {
                                                    setSelectedOption(idx);
                                                    setIsAnswerRevealed(true);
                                                }}
                                                className={btnStyle}
                                            >
                                                {option}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {/* 解説エリア */}
                            {isAnswerRevealed && (
                                <div className="mt-8 p-5 bg-slate-50 rounded-xl border border-slate-200 animate-fadeIn">
                                    <div className="flex items-center space-x-2 mb-2">
                                        <span className={`font-bold text-sm ${selectedOption === currentQ.answer ? 'text-emerald-600' : 'text-rose-600'}`}>
                                            {selectedOption === currentQ.answer ? '🎉 正解！' : '❌ 不正解...'}
                                        </span>
                                    </div>
                                    <p className="text-sm text-slate-700 leading-relaxed">
                                        <strong className="text-slate-900">解説：</strong>{currentQ.explanation}
                                    </p>
                                </div>
                            )}

                            {/* フッターナビゲーション（次へ・前へ） */}
                            <div className="flex justify-between items-center mt-8 pt-6 border-t border-slate-100">
                                <button 
                                    onClick={handlePrev}
                                    disabled={currentIndex === 0}
                                    className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed"
                                >
                                    ← 前の問題
                                </button>
                                <button 
                                    onClick={handleNext}
                                    disabled={currentIndex === questions.length - 1}
                                    className="px-6 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 shadow transition disabled:opacity-30 disabled:cursor-not-allowed"
                                >
                                    次の問題 →
                                </button>
                            </div>

                        </div>
                    </main>

                    {/* 設定モーダル（APIキー入力） */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">APIキーの設定</h3>
                                <p className="text-xs text-slate-500 mb-4">Gemini APIを利用してAI問題を作成するために必要です。</p>
                                <input 
                                    type="password" 
                                    placeholder="AIzaSy..." 
                                    defaultValue={apiKey}
                                    id="apiKeyInput"
                                    className="w-full p-3 border border-slate-200 rounded-xl text-sm mb-4 focus:outline-none focus:border-indigo-500"
                                />
                                <div className="flex justify-end space-x-2">
                                    <button 
                                        onClick={() => setIsSettingsOpen(false)}
                                        className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg"
                                    >
                                        キャンセル
                                    </button>
                                    <button 
                                        onClick={() => saveApiKey(document.getElementById('apiKeyInput').value)}
                                        className="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700"
                                    >
                                        保存する
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* AI問題生成モーダル */}
                    {isAiModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">✨ AIでオリジナル問題を作成</h3>
                                <p className="text-xs text-slate-500 mb-4">Geminiに好みのテーマのTOEIC問題を作らせます。</p>
                                
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">テーマ / Part指定</label>
                                        <input 
                                            type="text" 
                                            value={aiTheme}
                                            onChange={(e) => setAiTheme(e.target.value)}
                                            className="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                                            placeholder="例: TOEIC Part 2 (Response), ビジネス日程調整 など"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">問題数</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            max="10"
                                            value={aiCount}
                                            onChange={(e) => setAiCount(Number(e.target.value))}
                                            className="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-2">
                                    <button 
                                        onClick={() => setIsAiModalOpen(false)}
                                        className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg"
                                    >
                                        キャンセル
                                    </button>
                                    <button 
                                        onClick={generateQuestionsByAI}
                                        disabled={isGenerating}
                                        className="px-5 py-2 text-sm bg-gradient-to-r from-indigo-500 to-violet-600 text-white rounded-lg hover:opacity-90 disabled:opacity-50 font-medium"
                                    >
                                        {isGenerating ? '生成中...' : '生成を開始'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
