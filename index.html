<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI TOEIC Listening Trainer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            const [apiKey, setApiKey] = useState(localStorage.getItem('gemini_api_key') || '');
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [isAiModalOpen, setIsAiModalOpen] = useState(false);
            
            const [questions, setQuestions] = useState([
                {
                    id: 1,
                    question: "Where is the annual marketing conference being held this year?",
                    options: [
                        "A) In the main auditorium on the third floor.",
                        "B) Yes, the budget has already been approved.",
                        "C) Next Tuesday at around 2 PM."
                    ],
                    answer: 0,
                    explanation: "場所を尋ねる 'Where' に対する適切な答えは、選択肢Aの場所を示す表現です。"
                },
                {
                    id: 2,
                    question: "When will the quarterly financial report be finalized?",
                    options: [
                        "A) Financial statements and receipts.",
                        "B) By the end of this week, hopefully.",
                        "C) Mr. Davis from accounting."
                    ],
                    answer: 1,
                    explanation: "時期を尋ねる 'When' に対する答えとして、期限を示す 'By the end of this week' が適切です。"
                }
            ]);

            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedOption, setSelectedOption] = useState(null);
            const [isAnswerRevealed, setIsAnswerRevealed] = useState(false);
            
            // テキストを隠す状態（初期値：隠す）
            const [isTextBlurred, setIsTextBlurred] = useState(true);

            const [aiTheme, setAiTheme] = useState('TOEIC Part 2 (Response)');
            const [aiCount, setAiCount] = useState(3);
            const [isGenerating, setIsGenerating] = useState(false);

            const saveApiKey = (key) => {
                setApiKey(key);
                localStorage.setItem('gemini_api_key', key);
                setIsSettingsOpen(false);
            };

            const speakText = (text, onEndCallback) => {
                if (!('speechSynthesis' in window)) {
                    alert('お使いのブラウザは音声読み上げに対応していません。');
                    if (onEndCallback) onEndCallback();
                    return;
                }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;

                if (onEndCallback) {
                    utterance.onend = onEndCallback;
                }
                window.speechSynthesis.speak(utterance);
            };

            const playListeningSequence = () => {
                const currentQ = questions[currentIndex];
                speakText(currentQ.question, () => {
                    setTimeout(() => {
                        readOptionsSequentially(currentQ.options, 0);
                    }, 500);
                });
            };

            const readOptionsSequentially = (options, index) => {
                if (index >= options.length) return;
                speakText(options[index], () => {
                    setTimeout(() => {
                        readOptionsSequentially(options, index + 1);
                    }, 400);
                });
            };

            const handleNext = () => {
                if (currentIndex < questions.length - 1) {
                    setCurrentIndex(currentIndex + 1);
                    setSelectedOption(null);
                    setIsAnswerRevealed(false);
                    setIsTextBlurred(true); // 次の問題で自動ぼかし
                    window.speechSynthesis.cancel();
                }
            };

            const handlePrev = () => {
                if (currentIndex > 0) {
                    setCurrentIndex(currentIndex - 1);
                    setSelectedOption(null);
                    setIsAnswerRevealed(false);
                    setIsTextBlurred(true); // 前の問題で自動ぼかし
                    window.speechSynthesis.cancel();
                }
            };

            const handleOptionClick = (idx) => {
                if (selectedOption !== null) return;
                setSelectedOption(idx);
                setIsAnswerRevealed(true);
            };

            const generateQuestionsByAI = async () => {
                if (!apiKey) {
                    alert('先にAPIキーを設定してください。');
                    setIsSettingsOpen(true);
                    return;
                }

                setIsGenerating(true);
                const prompt = `あなたはプロのTOEIC講師です。以下のテーマでTOEIC形式の問題を ${aiCount} 問作成してください。
テーマ: ${aiTheme}
出力は必ず以下のJSON配列フォーマットのみで行ってください（Markdownのバッククォートも含めず、純粋なJSON配列文字列にしてください）。

[
  {
    "question": "英文の質問",
    "options": ["A) 選択肢1", "B) 選択肢2", "C) 選択肢3"],
    "answer": 0,
    "explanation": "日本語の解説"
  }
]
`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }]
                        })
                    });

                    const data = await response.json();
                    const textResponse = data.candidates[0].content.parts[0].text;
                    let cleanJsonText = textResponse.replace(/```json/g, '').replace(/```/g, '').trim();
                    const newQs = JSON.parse(cleanJsonText);

                    const formattedQs = newQs.map((q, idx) => ({
                        id: Date.now() + idx,
                        question: q.question,
                        options: q.options,
                        answer: q.answer,
                        explanation: q.explanation
                    }));

                    setQuestions(formattedQs);
                    setCurrentIndex(0);
                    setSelectedOption(null);
                    setIsAnswerRevealed(false);
                    setIsTextBlurred(true);
                    setIsAiModalOpen(false);
                } catch (error) {
                    console.error(error);
                    alert('AI問題の生成に失敗しました。');
                } finally {
                    setIsGenerating(false);
                }
            };

            const currentQ = questions[currentIndex];

            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    <header className="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="flex items-center space-x-3">
                            <span className="bg-indigo-600 text-white p-2 rounded-xl font-bold">🎧</span>
                            <h1 className="text-xl font-bold text-slate-800">TOEIC Listening Trainer</h1>
                        </div>
                        <div className="flex items-center space-x-3">
                            <button 
                                onClick={() => setIsAiModalOpen(true)}
                                className="bg-indigo-600 text-white px-4 py-2 rounded-xl font-medium text-sm shadow hover:bg-indigo-700 transition flex items-center space-x-1"
                            >
                                <span>✨ AI問題生成</span>
                            </button>
                            <button 
                                onClick={() => setIsSettingsOpen(true)}
                                className="p-2 bg-slate-100 text-slate-700 hover:bg-slate-200 rounded-xl transition"
                                title="設定"
                            >
                                ⚙️
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 max-w-2xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">
                        <div className="bg-white rounded-2xl shadow-lg border border-slate-200 p-6 sm:p-8">
                            
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                                <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-3 py-1.5 rounded-lg">
                                    Question {currentIndex + 1} / {questions.length}
                                </span>
                                <button 
                                    onClick={() => setIsTextBlurred(!isTextBlurred)}
                                    className={`text-xs px-3 py-1.5 rounded-lg font-medium transition ${
                                        isTextBlurred ? 'bg-amber-100 text-amber-800 hover:bg-amber-200' : 'bg-slate-200 text-slate-700 hover:bg-slate-300'
                                    }`}
                                >
                                    {isTextBlurred ? '👁️ テキストを表示する' : '🔒 テキストを隠す'}
                                </button>
                            </div>

                            <div className="text-center my-6">
                                <button 
                                    onClick={playListeningSequence}
                                    className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-6 py-3.5 rounded-xl shadow-md transition transform active:scale-95 flex items-center justify-center space-x-2 mx-auto text-base w-full sm:w-auto"
                                >
                                    <span>🔊 リスニング音声を再生（質問・選択肢）</span>
                                </button>
                            </div>

                            <div className="space-y-6">
                                {isTextBlurred && (
                                    <div 
                                        onClick={() => setIsTextBlurred(false)}
                                        className="bg-amber-50 border border-amber-200 text-amber-800 text-xs font-medium p-3 rounded-xl text-center cursor-pointer hover:bg-amber-100 transition"
                                    >
                                        🔒 リスニング集中モード中（クリックで全テキスト表示。次の問題で自動的に隠れます）
                                    </div>
                                )}

                                {/* 問題文 */}
                                <div className={`transition-all duration-300 ${isTextBlurred ? 'filter blur-sm select-none' : ''}`}>
                                    <h2 className="text-base sm:text-lg font-bold text-slate-900 leading-relaxed">
                                        {currentQ.question}
                                    </h2>
                                </div>

                                {/* 選択肢（ボタンの枠やA/B/Cは分かりやすくしつつ内容を制御） */}
                                <div className="space-y-3">
                                    {currentQ.options.map((option, idx) => {
                                        let btnStyle = "w-full text-left p-4 rounded-xl border transition font-medium text-sm sm:text-base ";
                                        
                                        if (selectedOption !== null) {
                                            if (idx === currentQ.answer) {
                                                btnStyle += "bg-emerald-50 border-emerald-400 text-emerald-900 shadow-sm";
                                            } else if (idx === selectedOption) {
                                                btnStyle += "bg-rose-50 border-rose-400 text-rose-900 shadow-sm";
                                            } else {
                                                btnStyle += "bg-white border-slate-200 text-slate-400 opacity-50";
                                            }
                                        } else {
                                            btnStyle += "bg-white border-slate-200 hover:border-indigo-400 hover:bg-slate-50 text-slate-700 shadow-sm cursor-pointer";
                                        }

                                        // 選択肢の文字自体をぼかすか、綺麗に隠すか
                                        const optionTextClass = isTextBlurred ? "filter blur-sm select-none inline-block" : "";

                                        return (
                                            <button 
                                                key={idx}
                                                onClick={() => handleOptionClick(idx)}
                                                className={btnStyle}
                                            >
                                                <span className={optionTextClass}>{option}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>

                            {isAnswerRevealed && (
                                <div className="mt-6 p-4 sm:p-5 bg-slate-50 rounded-xl border border-slate-200">
                                    <div className="font-bold text-sm mb-1">
                                        {selectedOption === currentQ.answer ? (
                                            <span className="text-emerald-600">🎉 正解！</span>
                                        ) : (
                                            <span className="text-rose-600">❌ 不正解...</span>
                                        )}
                                    </div>
                                    <p className="text-xs sm:text-sm text-slate-700 leading-relaxed">
                                        <strong>解説：</strong>{currentQ.explanation}
                                    </p>
                                </div>
                            )}

                            <div className="flex justify-between items-center mt-8 pt-4 border-t border-slate-100">
                                <button 
                                    onClick={handlePrev}
                                    disabled={currentIndex === 0}
                                    className="px-4 py-2 rounded-xl border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 disabled:opacity-30 disabled:cursor-not-allowed"
                                >
                                    ← 前の問題
                                </button>
                                <button 
                                    onClick={handleNext}
                                    disabled={currentIndex === questions.length - 1}
                                    className="px-5 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium hover:bg-indigo-700 shadow transition disabled:opacity-30 disabled:cursor-not-allowed"
                                >
                                    次の問題 →
                                </button>
                            </div>

                        </div>
                    </main>

                    {/* 設定モーダル */}
                    {isSettingsOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">APIキーの設定</h3>
                                <p className="text-xs text-slate-500 mb-4">Gemini APIキーを入力してください。</p>
                                <input 
                                    type="password" 
                                    placeholder="AIzaSy..." 
                                    defaultValue={apiKey}
                                    id="apiKeyInput"
                                    className="w-full p-3 border border-slate-200 rounded-xl text-sm mb-4 focus:outline-none focus:border-indigo-500"
                                />
                                <div className="flex justify-end space-x-2">
                                    <button 
                                        onClick={() => setIsSettingsOpen(false)}
                                        className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-xl"
                                    >
                                        キャンセル
                                    </button>
                                    <button 
                                        onClick={() => saveApiKey(document.getElementById('apiKeyInput').value)}
                                        className="px-4 py-2 text-sm bg-indigo-600 text-white rounded-xl hover:bg-indigo-700"
                                    >
                                        保存する
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* AI問題生成モーダル */}
                    {isAiModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex justify-center items-center p-4 z-50">
                            <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl">
                                <h3 className="text-lg font-bold text-slate-900 mb-2">✨ AIで問題を作成</h3>
                                <p className="text-xs text-slate-500 mb-4">お好みのテーマで問題を作成します。</p>
                                
                                <div className="space-y-4 mb-6">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">テーマ / Part</label>
                                        <input 
                                            type="text" 
                                            value={aiTheme}
                                            onChange={(e) => setAiTheme(e.target.value)}
                                            className="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-700 mb-1">問題数</label>
                                        <input 
                                            type="number" 
                                            min="1" 
                                            max="10"
                                            value={aiCount}
                                            onChange={(e) => setAiCount(Number(e.target.value))}
                                            className="w-full p-3 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500"
                                        />
                                    </div>
                                </div>

                                <div className="flex justify-end space-x-2">
                                    <button 
                                        onClick={() => setIsAiModalOpen(false)}
                                        className="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-xl"
                                    >
                                        キャンセル
                                    </button>
                                    <button 
                                        onClick={generateQuestionsByAI}
                                        disabled={isGenerating}
                                        className="px-5 py-2 text-sm bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 disabled:opacity-50 font-medium"
                                    >
                                        {isGenerating ? '生成中...' : '生成する'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
